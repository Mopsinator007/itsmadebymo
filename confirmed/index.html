<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Enquiry sent · itsmadebymo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Confirmation page — same viewfinder / grid system as the main site.
   The success mark is an autofocus box that locks on, then the tick draws. */
:root{
  color-scheme:dark;
  --bg:#0c0c0e;--panel:#121215;--ink:#eeece9;--muted:#95929a;
  --red:#ff3d3d;--fill:#e5242a;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.22);
  --glow:rgba(255,61,61,.17);--nav:rgba(12,12,14,.8);
  --grid:rgba(255,255,255,.075);--lit:rgba(115,14,26,.9);--hglow:rgba(90,10,22,.24);
  --disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --cell:16px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;color:var(--ink);font-family:var(--disp);font-weight:400;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{width:min(1200px,100% - clamp(40px,8vw,128px));margin:0 auto}

/* ---------- background grid (gray; dark red around the cursor) ---------- */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bg-grid{
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);background-position:-1px -1px;
}
.bg-lit,.bg-glow{opacity:var(--on,0);transition:opacity .35s}
.bg-lit{
  z-index:30;
  background-image:linear-gradient(var(--lit) 1px,transparent 1px),linear-gradient(90deg,var(--lit) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);background-position:-1px -1px;
  -webkit-mask-image:radial-gradient(circle 110px at var(--mx,50%) var(--my,50%),#000,rgba(0,0,0,.4) 50%,transparent);
  mask-image:radial-gradient(circle 110px at var(--mx,50%) var(--my,50%),#000,rgba(0,0,0,.4) 50%,transparent);
}
.bg-glow{background:radial-gradient(circle 160px at var(--mx,50%) var(--my,50%),var(--hglow),transparent 70%)}
.bg-cell{position:fixed;left:0;top:0;z-index:31;pointer-events:none;width:calc(var(--cell) + 1px);height:calc(var(--cell) + 1px);
  background:rgba(100,14,26,.24);box-shadow:inset 0 0 0 1px rgba(140,24,40,.6);
  transform:translate(var(--cx,0px),var(--cy,0px));opacity:var(--on,0);transition:opacity .35s,transform .12s ease-out}
@media(hover:none){.bg-lit,.bg-glow,.bg-cell{display:none}}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-stretch:112%;font-size:22px;letter-spacing:-.03em;text-decoration:none}
.dm{width:10px;height:10px;border-radius:50%;background:var(--red);animation:ping 2s infinite}
.back{font-size:15px;font-weight:500;text-decoration:none}

/* ---------- main ---------- */
main{position:relative;flex:1;display:grid;place-items:center;overflow:hidden;isolation:isolate;padding:clamp(56px,9vw,120px) 0}
.spot{position:absolute;z-index:-1;left:25%;right:25%;top:-30%;bottom:0;pointer-events:none;filter:blur(30px);
  background:conic-gradient(from 168deg at 50% 0%,transparent 0deg,var(--glow) 12deg,transparent 26deg);animation:fade 2.4s .2s ease-out both}
.box{text-align:center;max-width:640px;padding:0 4px}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 22px;color:var(--muted);font-size:15px;font-weight:500}
.eyebrow::before{content:"";width:9px;height:9px;background:var(--red);flex:none}

/* autofocus box that locks on, then the tick draws */
.lock{position:relative;width:92px;height:92px;margin:0 auto 34px;display:grid;place-items:center;--bs:20px;
  background:
    linear-gradient(var(--red),var(--red)) 0 0/var(--bs) 1px no-repeat,
    linear-gradient(var(--red),var(--red)) 0 0/1px var(--bs) no-repeat,
    linear-gradient(var(--red),var(--red)) 100% 0/var(--bs) 1px no-repeat,
    linear-gradient(var(--red),var(--red)) 100% 0/1px var(--bs) no-repeat,
    linear-gradient(var(--red),var(--red)) 0 100%/var(--bs) 1px no-repeat,
    linear-gradient(var(--red),var(--red)) 0 100%/1px var(--bs) no-repeat,
    linear-gradient(var(--red),var(--red)) 100% 100%/var(--bs) 1px no-repeat,
    linear-gradient(var(--red),var(--red)) 100% 100%/1px var(--bs) no-repeat;
  animation:lock .8s .15s cubic-bezier(.2,.9,.2,1) both}
.lock::before{content:"";position:absolute;inset:0;border:1px solid var(--red);opacity:0;animation:flash 1s .85s ease-out}
.lock svg{width:38px;height:38px;fill:none;stroke:var(--red);stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .55s .8s ease-out forwards}

h1{font-weight:800;font-stretch:112%;margin:0 0 22px;letter-spacing:-.03em;line-height:.96;font-size:clamp(48px,8vw,104px)}
.cur{display:inline-block;width:.5em;height:.12em;margin-left:.06em;background:var(--red);animation:blink 1.1s steps(1) infinite}
.lede{color:var(--muted);font-size:clamp(17px,1.7vw,20px);margin:0 auto 40px;max-width:44ch}
.box>:not(.lock){animation:reveal 1.2s cubic-bezier(.2,.7,.2,1) both}
.box>:nth-child(2){animation-delay:.45s}.box>:nth-child(3){animation-delay:.55s}.box>:nth-child(4){animation-delay:.65s}.box>:nth-child(5){animation-delay:.75s}.box>:nth-child(6){animation-delay:.85s}

.btn{display:inline-block;padding:16px 30px;border:0;background:var(--fill);color:#fff;font:600 16px var(--disp);letter-spacing:.005em;text-decoration:none;cursor:pointer;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%);transition:background .25s,color .25s}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--bg)}
.social{display:flex;justify-content:center;gap:10px;margin-top:34px}
.social a{width:50px;height:50px;display:grid;place-items:center;border:1px solid var(--line2);transition:background .25s,color .25s,border-color .25s}
.social a:hover,.social a:focus-visible{background:var(--fill);border-color:var(--fill);color:#fff}
.social svg{width:20px;height:20px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line2);padding:22px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{text-decoration:none;display:inline-block}

/* links: red + a little bigger on hover / click / focus, lifted above the grid highlight */
.back,footer a{transition:color .2s,transform .2s,text-shadow .2s;transform-origin:left center}
footer a{transform-origin:right center}
.back:hover,.back:active,.back:focus-visible,
footer a:hover,footer a:active,footer a:focus-visible{color:#ff4a4a;transform:scale(1.12);text-shadow:0 0 14px rgba(255,61,61,.45);position:relative;z-index:40}

/* ---------- motion ---------- */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes reveal{from{opacity:0;filter:blur(10px);transform:translateY(14px)}to{opacity:1;filter:none;transform:none}}
@keyframes lock{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
@keyframes flash{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(255,61,61,0)}0%{box-shadow:0 0 0 0 rgba(255,61,61,.6)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.lock svg{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="bg bg-grid" aria-hidden="true"></div>
<div class="bg bg-lit" aria-hidden="true"></div>
<div class="bg bg-glow" aria-hidden="true"></div>
<div class="bg-cell" aria-hidden="true"></div>

<nav><div class="wrap"><a class="logo" href="/"><i class="dm"></i>itsmadebymo</a><a class="back" href="/">Back to site</a></div></nav>

<main>
  <div class="spot"></div>
  <div class="box">
    <div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <p class="eyebrow">Enquiry sent</p>
    <h1>Thank you.<span class="cur" aria-hidden="true"></span></h1>
    <p class="lede">Your message is on its way to me. I handle every enquiry myself and will get back to you personally by email.</p>
    <a class="btn" href="/">Back to site</a>
    <div class="social">
      <a href="https://www.instagram.com/itsmadebymo" target="_blank" rel="noopener" aria-label="Instagram @itsmadebymo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor" stroke="none"/></svg></a>
      <a href="https://www.tiktok.com/@itsmadebymo" target="_blank" rel="noopener" aria-label="TikTok @itsmadebymo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.7 5.7 0 1 0 4.9 5.6V9.2a7.4 7.4 0 0 0 4.3 1.4V7.5a4.3 4.3 0 0 1-3.2-1.7z"/></svg></a>
    </div>
  </div>
</main>

<footer><div class="wrap"><span>© <span id="yr">2026</span> itsmadebymo</span><a href="mailto:contact@itsmadebymo.com">contact@itsmadebymo.com</a></div></footer>

<script>
(function(){
  var d=document,root=d.documentElement;
  /* grid turns dark red under the cursor (eased follow) */
  if(matchMedia('(hover:hover)').matches){
    var raf=0,tx=0,ty=0,cx=0,cy=0,seen=false,k=matchMedia('(prefers-reduced-motion:reduce)').matches?1:.16,
        cell=parseFloat(getComputedStyle(root).getPropertyValue('--cell'))||16;
    function follow(){
      cx+=(tx-cx)*k;cy+=(ty-cy)*k;
      root.style.setProperty('--mx',cx+'px');root.style.setProperty('--my',cy+'px');
      raf=(Math.abs(tx-cx)>.5||Math.abs(ty-cy)>.5)?requestAnimationFrame(follow):0;
    }
    addEventListener('pointermove',function(ev){
      tx=ev.clientX;ty=ev.clientY;
      if(!seen){seen=true;cx=tx;cy=ty}
      root.style.setProperty('--cx',(Math.floor((tx+1)/cell)*cell-1)+'px');
      root.style.setProperty('--cy',(Math.floor((ty+1)/cell)*cell-1)+'px');
      root.style.setProperty('--on',1);
      if(!raf)raf=requestAnimationFrame(follow);
    },{passive:true});
    d.addEventListener('mouseleave',function(){root.style.setProperty('--on',0)});
  }
  d.getElementById('yr').textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
