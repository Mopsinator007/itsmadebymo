<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>EXCAVATOR · itsmadebymo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Excavator page — same grid / viewfinder system as the main site.
   Own touch: the machine is wired to a live telemetry strip. The boom, stick
   and bucket readouts are read straight from the animation, so the numbers
   always match what the excavator is doing. */
:root{
  color-scheme:dark;
  --bg:#0c0c0e;--ink:#eeece9;--muted:#95929a;
  --red:#ff3d3d;--fill:#e5242a;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.22);
  --glow:rgba(255,61,61,.17);--pool:rgba(255,61,61,.2);--spot:rgba(255,80,80,.2);
  --dirt1:#3a3538;--dirt2:#121012;--dust:#9a959c;--vig:.45;
  --grid:rgba(255,255,255,.075);--lit:rgba(115,14,26,.9);--hglow:rgba(90,10,22,.24);
  --disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --cell:16px;
}
*{box-sizing:border-box}
html{height:100%;overflow:hidden;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;display:flex;flex-direction:column;color:var(--ink);font-family:var(--disp);font-weight:400;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}

/* ---------- background grid (gray; dark red around the cursor) ---------- */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bg-grid{
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);background-position:-1px -1px;
}
.bg-lit,.bg-glow{opacity:var(--on,0);transition:opacity .35s}
.bg-lit{
  z-index:30;
  background-image:linear-gradient(var(--lit) 1px,transparent 1px),linear-gradient(90deg,var(--lit) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);background-position:-1px -1px;
  -webkit-mask-image:radial-gradient(circle 110px at var(--mx,50%) var(--my,50%),#000,rgba(0,0,0,.4) 50%,transparent);
  mask-image:radial-gradient(circle 110px at var(--mx,50%) var(--my,50%),#000,rgba(0,0,0,.4) 50%,transparent);
}
.bg-glow{background:radial-gradient(circle 160px at var(--mx,50%) var(--my,50%),var(--hglow),transparent 70%)}
.bg-cell{position:fixed;left:0;top:0;z-index:31;pointer-events:none;width:calc(var(--cell) + 1px);height:calc(var(--cell) + 1px);
  background:rgba(100,14,26,.24);box-shadow:inset 0 0 0 1px rgba(140,24,40,.6);
  transform:translate(var(--cx,0px),var(--cy,0px));opacity:var(--on,0);transition:opacity .35s,transform .12s ease-out}
@media(hover:none){.bg-lit,.bg-glow,.bg-cell{display:none}}

/* ---------- top / bottom bars ---------- */
.bar{position:relative;background:rgba(12,12,14,.82);padding:14px clamp(22px,5vw,64px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:15px;font-weight:500}
header.bar{border-bottom:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
footer.bar{border-top:1px solid var(--line2);color:var(--muted);font-size:14px;font-weight:400}
header.bar>span:last-child{color:var(--muted);font-weight:400}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-stretch:112%;letter-spacing:-.02em;font-size:17px}
.brand svg{width:28px;height:21px;flex:none}
.bar a{color:inherit;text-decoration:none;display:inline-block;transform-origin:right center;transition:color .2s,transform .2s,text-shadow .2s}
.bar a:hover,.bar a:active,.bar a:focus-visible{color:#ff4a4a;transform:scale(1.12);text-shadow:0 0 14px rgba(255,61,61,.45);position:relative;z-index:40}

/* ---------- main ---------- */
main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(70% 55% at 40% 100%,var(--pool),transparent 70%)}
.spot{position:absolute;z-index:0;left:-20%;right:-20%;top:-10%;bottom:12%;pointer-events:none;filter:blur(26px);
  background:conic-gradient(from 168deg at 42% 0%,transparent 0deg,var(--spot) 12deg,transparent 24deg);
  -webkit-mask-image:linear-gradient(#000 30%,transparent 100%);mask-image:linear-gradient(#000 30%,transparent 100%);animation:lights 2.6s .3s ease-out both}
.frame{position:absolute;inset:clamp(12px,2.2vw,26px);z-index:3;pointer-events:none}
.frame b{position:absolute;width:20px;height:20px;border:0 solid var(--red);opacity:.7}
.frame b:nth-child(1){top:0;left:0;border-width:1px 0 0 1px}.frame b:nth-child(2){top:0;right:0;border-width:1px 1px 0 0}.frame b:nth-child(3){bottom:0;left:0;border-width:0 0 1px 1px}.frame b:nth-child(4){bottom:0;right:0;border-width:0 1px 1px 0}
.vig{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(110% 85% at 50% 50%,transparent 50%,rgba(0,0,0,var(--vig)) 100%)}

.copy{position:relative;z-index:2;padding:clamp(20px,5vh,64px) clamp(22px,5vw,64px) 0;max-width:900px;animation:reveal 1.6s .2s cubic-bezier(.2,.7,.2,1) both}
.hair{display:block;width:72px;height:2px;background:var(--red);margin:0 0 26px;transform-origin:left;animation:draw 1.4s .4s cubic-bezier(.6,0,.2,1) both}
.status{display:flex;align-items:center;gap:12px;margin:0 0 20px;color:var(--muted);font-size:15px;font-weight:500}
.status::before{content:"";width:9px;height:9px;background:var(--red);flex:none}
h1{font-weight:800;font-stretch:104%;font-size:clamp(34px,min(10.5vw,8vh),60px);line-height:.98;letter-spacing:-.03em;margin:0 0 clamp(14px,3vh,26px);max-width:11.5em}
.cur{display:inline-block;width:.5em;height:.12em;margin-left:.06em;background:var(--red);animation:blink 1.1s steps(1) infinite}
.copy p{margin:0;max-width:40ch;color:var(--muted);font-size:clamp(17px,1.8vw,20px)}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:22px;margin-top:clamp(18px,4vh,34px)}
.cta{display:inline-block;padding:15px 28px;background:var(--fill);color:#fff;text-decoration:none;font:600 16px var(--disp);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%);transition:background .25s,color .25s}
.cta:hover,.cta:focus-visible{background:var(--ink);color:var(--bg)}
.social{display:flex;gap:10px}
.social a{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--ink);transition:background .25s,color .25s,border-color .25s}
.social a:hover,.social a:focus-visible{background:var(--fill);border-color:var(--fill);color:#fff}
.social svg{width:20px;height:20px}

/* ---------- scene + telemetry ---------- */
.scene{position:relative;z-index:2;align-self:flex-end;width:min(100%,1040px);margin-top:12px;padding:0 clamp(12px,2vw,28px) clamp(14px,2.4vw,30px);animation:lit 2.4s .3s ease-out both}
.scene svg{display:block;width:100%;height:auto;overflow:visible;transform:translate3d(calc(var(--px,0)*12px),calc(var(--py,0)*6px),0);transition:transform .5s ease-out}
.tm{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;border:1px solid var(--line2);background:rgba(12,12,14,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tm>div{padding:9px 14px 10px;border-left:1px solid var(--line);min-width:0}
.tm>div:first-child{border-left:0}
.tm span{display:block;font-size:13px;line-height:1.3;color:var(--muted)}
.tm b{display:block;font:500 15px/1.4 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.tm i{display:block;height:2px;margin-top:6px;background:var(--line)}
.tm u{display:block;height:100%;width:50%;background:var(--red);text-decoration:none}
.tm .cy b{color:var(--red)}
.boom{transform-box:view-box;transform-origin:290px 178px;animation:boom 5.2s ease-in-out infinite}
.stick{transform-box:view-box;transform-origin:420px 120px;animation:stick 5.2s ease-in-out infinite}
.bucket{transform-box:view-box;transform-origin:500px 235px;animation:bucket 5.2s ease-in-out infinite}
.machine{animation:bob .6s ease-in-out infinite alternate}
.beacon{animation:blink 1.4s steps(1) infinite}
.puff{animation:puff 3.2s ease-out infinite;opacity:0}
.puff:nth-of-type(2){animation-delay:1.05s}.puff:nth-of-type(3){animation-delay:2.1s}
.dust circle{animation:dust 5.2s ease-out infinite;opacity:0}
.dust circle:nth-child(2){animation-delay:.25s}.dust circle:nth-child(3){animation-delay:.5s}.dust circle:nth-child(4){animation-delay:.15s}
.gl{animation:tw 3s ease-in-out infinite}.gl:nth-child(2){animation-delay:.7s}.gl:nth-child(3){animation-delay:1.5s}.gl:nth-child(4){animation-delay:2.1s}

@keyframes boom{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(7deg)}}
@keyframes stick{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(12deg)}}
@keyframes bucket{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-24deg)}}
@keyframes bob{to{transform:translateY(1px)}}
@keyframes blink{0%{opacity:1}50%{opacity:.2}}
@keyframes puff{0%{opacity:.45;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-14px,-46px) scale(1.8)}}
@keyframes dust{0%,40%{opacity:0;transform:translate(0,0) scale(.5)}55%{opacity:.5}100%{opacity:0;transform:translate(16px,-34px) scale(1.7)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes lit{from{filter:brightness(.1) saturate(.6)}to{filter:none}}
@keyframes lights{from{opacity:0}to{opacity:1}}
@keyframes reveal{from{opacity:0;filter:blur(14px);transform:translateY(14px)}to{opacity:1;filter:none;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}

@media (min-width:760px) and (min-aspect-ratio:1/1){
  main{flex-direction:row;align-items:center;justify-content:space-between}
  .copy{flex:0 1 46%;padding-top:0;padding-bottom:0}
  h1{font-size:clamp(30px,min(4.2vw,9vh),72px)}
  .scene{align-self:center;flex:0 0 54%;width:54%;margin:0;padding:0 clamp(8px,2vw,32px) 0 0}
  .scene svg{max-height:60vh}
}
@media (max-height:560px){
  .copy p{display:none}.hair{margin-bottom:12px}.status{margin-bottom:8px}h1{font-size:clamp(26px,8.5vh,48px)}.cta,.social a{height:40px}.social a{width:40px}.cta{padding:0 22px;line-height:40px}
  .tm{display:none}
}
@media (max-width:759px) and (max-height:720px){.tm{display:none}}
@media (max-width:520px){.tm{grid-template-columns:repeat(2,1fr)}.tm>div:nth-child(3){border-left:0}.tm>div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
  var d=document,root=d.documentElement,sc=d.getElementById('scene'),
      still=matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* the excavator drifts slightly with the pointer */
  if(!still){
    addEventListener('pointermove',function(ev){sc.style.setProperty('--px',(ev.clientX/innerWidth-.5).toFixed(3));sc.style.setProperty('--py',(ev.clientY/innerHeight-.5).toFixed(3));});
  }

  /* grid turns dark red under the cursor (eased follow) */
  if(matchMedia('(hover:hover)').matches){
    var raf=0,tx=0,ty=0,cx=0,cy=0,seen=false,k=still?1:.16,
        cell=parseFloat(getComputedStyle(root).getPropertyValue('--cell'))||16;
    function follow(){
      cx+=(tx-cx)*k;cy+=(ty-cy)*k;
      root.style.setProperty('--mx',cx+'px');root.style.setProperty('--my',cy+'px');
      raf=(Math.abs(tx-cx)>.5||Math.abs(ty-cy)>.5)?requestAnimationFrame(follow):0;
    }
    addEventListener('pointermove',function(ev){
      tx=ev.clientX;ty=ev.clientY;
      if(!seen){seen=true;cx=tx;cy=ty}
      root.style.setProperty('--cx',(Math.floor((tx+1)/cell)*cell-1)+'px');
      root.style.setProperty('--cy',(Math.floor((ty+1)/cell)*cell-1)+'px');
      root.style.setProperty('--on',1);
      if(!raf)raf=requestAnimationFrame(follow);
    },{passive:true});
    d.addEventListener('mouseleave',function(){root.style.setProperty('--on',0)});
  }

  /* live telemetry: read the real rotation of boom / stick / bucket from the animation */
  var parts=[['boom','.boom',-2,7],['stick','.stick',-16,12],['bucket','.bucket',-24,14]].map(function(p){
    return {el:d.querySelector(p[1]),t:d.getElementById('t-'+p[0]),b:d.getElementById('b-'+p[0]),lo:p[2],hi:p[3]};
  });
  var cyEl=d.getElementById('t-cy'),t0=performance.now(),last=-999;
  function ang(el){
    var m=getComputedStyle(el).transform,v=m&&m.match(/^matrix\(([^)]+)\)$/);
    if(!v)return 0;
    var p=v[1].split(',');
    return Math.atan2(parseFloat(p[1]),parseFloat(p[0]))*180/Math.PI;
  }
  function fmt(a){var n=Math.abs(a).toFixed(1);return (a<0?'-':'+')+(n.length<4?'0':'')+n+'°'}
  function tick(now){
    if(now-last>70){
      last=now;
      parts.forEach(function(p){
        var a=ang(p.el);
        p.t.textContent=fmt(a);
        p.b.style.width=Math.max(0,Math.min(100,(a-p.lo)/(p.hi-p.lo)*100))+'%';
      });
      cyEl.textContent=('000'+(Math.floor((now-t0)/5200)+1)).slice(-4);
    }
    if(!still)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
